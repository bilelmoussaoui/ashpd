[package]
name = "ashpd-backend-demo"
version = "0.1.0"
edition.workspace = true
rust-version = "1.89"
license.workspace = true

[dependencies]
async-trait = "0.1"
tokio = { version = "1.54.1", features = [
    "io-util",
    "net",
    "time",
    "macros",
    "rt-multi-thread",
] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3.23"
zbus = { workspace = true, features = ["tokio"] }

[dependencies.ashpd]
workspace = true
features = [
    "backend",
    "account",
    "screencast",
    "screenshot",
    "secret",
    "wallpaper",
    "settings",
    "tracing",
    "tokio",
]
