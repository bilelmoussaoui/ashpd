[package]
authors = ["Bilal Elmoussaoui <bil.elmoussaoui@gmail.com>"]
edition = "2024"
license = "MIT"
name = "ashpd-demo"
rust-version = "1.92"
version = "0.1.0"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_9"] }
anyhow = "1.0"
ashpd = { path = "../../client", version = "0.14.0", default-features = false, features = [
    "tokio",
    "gtk4",
    "tracing",
    "pipewire",
    "account",
    "background",
    "camera",
    "clipboard",
    "dynamic_launcher",
    "email",
    "file_chooser",
    "global_shortcuts",
    "inhibit",
    "input_capture",
    "location",
    "network_monitor",
    "notification",
    "open_uri",
    "proxy_resolver",
    "remote_desktop",
    "screencast",
    "screenshot",
    "secret",
    "settings",
    "usb",
    "wallpaper",
    "flatpak",
    "documents",
    "print",
] }
async-channel = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
formatx = "0.4"
futures-util.workspace = true
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gst = { package = "gstreamer", version = "0.25" }
gst4gtk = { package = "gst-plugin-gtk4", version = "0.15", features = [
    "wayland",
    "x11egl",
    "x11glx",
    "gtk_v4_14",
] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
rusb = "0.9.4"
serde.workspace = true
shumate = { version = "0.8", package = "libshumate" }
tokio = { workspace = true, default-features = false, features = [
    "io-util",
    "net",
    "time",
    "rt-multi-thread",
    "macros",
] }
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
glib-build-tools = "0.22"
