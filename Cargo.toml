[workspace]
resolver = "3"

members = ["client", "demo/client", "demo/backend"]

[workspace.package]
authors = ["Bilal Elmoussaoui <bil.elmoussaoui@gmail.com>"]
categories = ["gui", "os::linux-apis", "api-bindings"]
edition = "2024"
keywords = ["portal", "flatpak", "xdg", "desktop", "dbus"]
license = "MIT"
repository = "https://github.com/bilelmoussaoui/ashpd"
version = "0.14.0"

[workspace.dependencies]
ashpd = { path = "client", version = "0.14.0", default-features = false }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54.1", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
zbus = { version = "6.0.0", default-features = false, features = ["proxy", "service", "object-manager"] }
