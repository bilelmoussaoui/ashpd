[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu"
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
allow = [
  "MIT",
  "Unicode-3.0",
  "BSD-3-Clause", # pipewire -> libspa -> bindgen
  "Apache-2.0", # pipewire -> libspa -> bindgen -> clang-sys
  "ISC", # pipewire -> libspa -> bindgen -> clang-sys -> libloading
  "Apache-2.0 WITH LLVM-exception", # cfg-expr
  "MPL-2.0", #gst-plugin-gtk4
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
    { name = "shlex", version = "1.3.0" },
    { name = "itertools", version = "0.13.0" },
    { name = "quick-xml", version = "0.41.0" }, # wayland-scanner uses 0.41; tests use 0.42
    { name = "nom", version = "7.1.3" },
    { name = "syn", version = "2.0.119" }, # bindgen and enumflags2 still use syn 2
    { name = "system-deps", version = "7.0.8" }, # libadwaita, libshumate and pipewire use 7
]
